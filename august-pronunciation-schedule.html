<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f8">
  <title>8月 スケジュール</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172638;
      --muted: #647180;
      --line: #d9e2e7;
      --paper: #f4f7f8;
      --panel: #ffffff;
      --accent: #087c78;
      --accent-soft: #e1f3f0;
      --navy: #17324d;
      --gold: #d5a63b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
    }

    .page {
      width: min(100%, 680px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(23, 50, 77, 0.12);
    }

    .hero {
      position: relative;
      min-height: 330px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: var(--navy);
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(to bottom, transparent, rgba(12, 27, 42, 0.9));
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 30px 24px 24px;
      color: #ffffff;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      color: #e8c66e;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .hero-copy p {
      margin: 9px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.94rem;
    }

    main {
      padding: 24px 18px 40px;
    }

    .intro {
      margin: 0 4px 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .lesson {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(23, 50, 77, 0.07);
    }

    .lesson summary {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 24px;
      gap: 12px;
      align-items: center;
      min-height: 100px;
      padding: 16px;
      cursor: pointer;
      list-style: none;
    }

    .lesson summary::-webkit-details-marker {
      display: none;
    }

    .lesson-number {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #ffffff;
      background: var(--accent);
      font-size: 0.92rem;
      font-weight: 900;
    }

    .date {
      display: block;
      color: var(--navy);
      font-size: 1.13rem;
      font-weight: 900;
      line-height: 1.45;
    }

    .lesson-title {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.87rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .chevron {
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: rotate(45deg) translateY(-3px);
      transition: transform 180ms ease;
    }

    .lesson[open] .chevron {
      transform: rotate(225deg) translate(-2px, -2px);
    }

    .detail {
      padding: 17px 18px 20px;
      border-top: 1px solid var(--line);
      background: #f9fbfb;
    }

    .detail-label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail p {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.85;
    }

    .video-embed {
      width: min(100%, 320px);
      margin-top: 15px;
      margin-right: auto;
      margin-left: auto;
      aspect-ratio: 9 / 16;
      border-radius: 8px;
      overflow: hidden;
      background: #101820;
      box-shadow: 0 8px 20px rgba(23, 50, 77, 0.14);
    }

    .video-embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .footer-note {
      margin: 24px 4px 0;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.65;
      text-align: center;
    }

    @media (min-width: 720px) {
      body {
        padding: 24px 0;
      }

      .page {
        min-height: calc(100vh - 48px);
        border-radius: 12px;
        overflow: hidden;
      }

      .hero {
        min-height: 390px;
      }

      main {
        padding: 30px 30px 48px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <img
        src="assets/schedule/pronunciation-schedule.webp"
        width="1200"
        height="676"
        alt="英語学習のスケジュール帳に書き込む犬"
      >
      <div class="hero-copy">
        <span class="eyebrow">August 2026</span>
        <h1>スケジュール</h1>
      </div>
    </header>

    <main>
      <p class="intro">各レッスンの詳細は、日程をタップしてご確認ください。</p>

      <details class="lesson">
        <summary>
          <span class="lesson-number">01</span>
          <span>
            <span class="date">8月11日（火）21:00〜</span>
            <span class="lesson-title">発音レッスン（まりあ担当）</span>
          </span>
          <span class="chevron" aria-hidden="true"></span>
        </summary>
        <div class="detail">
          <p class="detail-label">Lesson details</p>
          <p>課題は明日改めてお送りしますが、こちらのシーンを用います。</p>
          <div class="video-embed">
            <iframe
              src="https://www.youtube.com/embed/N7TzWUf8C70"
              title="8月11日 発音レッスン課題シーン"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </details>

      <details class="lesson">
        <summary>
          <span class="lesson-number">02</span>
          <span>
            <span class="date">8月25日（火）21:00〜</span>
            <span class="lesson-title">発音レッスン（まりあ担当）</span>
          </span>
          <span class="chevron" aria-hidden="true"></span>
        </summary>
        <div class="detail">
          <p class="detail-label">Lesson details</p>
          <p>以前途中だった「BREAK UP」を実施予定です。しかし、8月11日のレッスンを踏まえて内容が変更になる可能性がございますので、ご承知おきください。</p>
        </div>
      </details>

      <p class="footer-note">レッスン内容に変更がある場合は、改めてお知らせいたします。</p>
    </main>
  </div>
</body>
</html>
